<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 外部通信を完全に遮断するセキュリティ設定。データがネットに送られることはありません -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>ローカルメモ</title>
<style>
:root{
  --bg:#f3f5f3; --panel:#ffffff; --ink:#1c2420; --sub:#66716b; --line:#dde3df;
  --accent:#0f6b62; --accent-ink:#ffffff; --tag:#e3efec; --tag-ink:#0b5a52;
  --danger:#b3261e; --sel:#e8f1ee; --code:#eef1ef;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --panel:#181d1b; --ink:#e6ebe8; --sub:#8d9a93; --line:#2a322e;
    --accent:#4fc1b2; --accent-ink:#06211d; --tag:#1f3430; --tag-ink:#8fdcd0;
    --danger:#f2867f; --sel:#202a26; --code:#222a26;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --panel:#181d1b; --ink:#e6ebe8; --sub:#8d9a93; --line:#2a322e;
  --accent:#4fc1b2; --accent-ink:#06211d; --tag:#1f3430; --tag-ink:#8fdcd0;
  --danger:#f2867f; --sel:#202a26; --code:#222a26;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:320px 1fr;flex:1;min-height:0}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.side-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.btn:hover{background:var(--sel)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.icon{padding:7px 10px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 10px;border-radius:999px;background:var(--tag);color:var(--tag-ink);font-size:12.5px;border:1px solid transparent}
button.chip.on{background:var(--accent);color:var(--accent-ink)}
.list{flex:1;overflow:auto;min-height:0}
.item{display:block;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent}
.item:hover{background:var(--sel)}
.item.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12.5px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .snip{font-size:13px;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.empty{padding:28px 18px;color:var(--sub);text-align:center}
.foot{padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;align-items:center}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.bar .grow{flex:1}
.status{font-size:12.5px;color:var(--sub)}
.back{display:none}
.editor{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 20px;gap:10px;overflow:auto}
.title{width:100%;border:0;background:transparent;font-size:24px;font-weight:700;padding:4px 0;outline:none;line-height:1.3}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.meta .tags{flex:1;min-width:160px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:6px 14px;border-bottom:2px solid transparent;color:var(--sub)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.body{flex:1;min-height:320px;width:100%;resize:none;border:0;background:transparent;outline:none;font:15px/1.8 var(--mono);padding:4px 0}
.preview{flex:1;min-height:320px;max-width:76ch}
.preview h1,.preview h2,.preview h3{line-height:1.35;margin:1.2em 0 .4em}
.preview h1{font-size:1.6em}.preview h2{font-size:1.3em}.preview h3{font-size:1.1em}
.preview p{margin:.6em 0}
.preview code{background:var(--code);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:.92em}
.preview pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}
.preview pre code{padding:0;background:none}
.preview blockquote{margin:.8em 0;padding:2px 14px;border-left:3px solid var(--accent);color:var(--sub)}
.preview a{color:var(--accent)}
.preview hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.preview ul,.preview ol{padding-left:1.4em}
.hidden{display:none!important}
.placeholder{margin:auto;color:var(--sub);text-align:center;padding:24px;max-width:36ch}
.placeholder p{margin:.4em 0}
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:10;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px}
.pop button:hover{background:var(--sel)}
.pop .note{font-size:12px;color:var(--sub);padding:4px 10px 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:50}


.top{display:flex;gap:4px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.mode{border:0;background:transparent;padding:6px 16px;border-radius:8px;font-weight:600;color:var(--sub)}
.mode.on{background:var(--sel);color:var(--ink)}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--danger);color:var(--bg);font-size:11px;line-height:18px;text-align:center}
.todoView{flex:1;min-height:0;overflow:auto}
.todoWrap{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.addbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.field{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.addbox .field.text,.tdedit{width:100%}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.td{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.td.done .tdtext{text-decoration:line-through;color:var(--sub)}
.chk{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.tdmain{flex:1;min-width:0}
.tdtext{word-break:break-word}
.tdmeta{font-size:12.5px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap}
.due.over{color:var(--danger);font-weight:600}
.due.today{color:var(--accent);font-weight:600}
.ib{border:0;background:transparent;padding:2px 7px;border-radius:6px;color:var(--sub);flex:none}
.ib:hover{background:var(--sel);color:var(--ink)}
@media (max-width:760px){
  body.editing .top{display:none}
  .app{grid-template-columns:1fr}
  .main{display:none}
  body.editing .side{display:none}
  body.editing .main{display:flex}
  .back{display:inline-block}
  .title{font-size:20px}
  .editor{padding:12px 14px}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:fade .2s ease-out}
  @keyframes fade{from{opacity:0;transform:translate(-50%,6px)}}
}
</style>
</head>
<body>
<header class="top">
  <button id="modeNotes" class="mode on">メモ</button>
  <button id="modeTodo" class="mode">ToDo<span id="todoBadge" class="badge hidden"></span></button>
</header>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="row">
        <input id="q" class="search" type="search" placeholder="検索(タイトル・本文・タグ)" aria-label="検索">
        <button id="new" class="btn primary" title="新規メモ (Ctrl/Cmd+Alt+N)">新規</button>
      </div>
      <div id="tagbar" class="tagbar"></div>
    </div>
    <div id="list" class="list"></div>
    <div class="foot">
      <span id="count"></span>
      <button id="theme" class="btn icon" title="テーマ切替">🌓</button>
    </div>
  </aside>

  <main class="main">
    <div class="bar">
      <button id="back" class="btn back">← 一覧</button>
      <span id="status" class="status grow"></span>
      <button id="pin" class="btn icon hidden" title="お気に入り">☆</button>
      <div class="menu">
        <button id="menuBtn" class="btn">保存・取り込み ▾</button>
        <div id="pop" class="pop hidden">
          <button data-act="folder">📁 フォルダに自動保存(.md)</button>
          <button data-act="exportOne">このメモを .md で保存</button>
          <button data-act="exportAll">全メモを ZIP で保存</button>
          <button data-act="importMd">.md ファイルを取り込む</button>
          <button data-act="backup">バックアップ(JSON)</button>
          <div class="note" id="folderNote"></div>
        </div>
      </div>
      <button id="del" class="btn danger hidden">削除</button>
    </div>

    <div id="placeholder" class="placeholder">
      <p><strong>メモを選ぶか、新規作成してください</strong></p>
      <p>データはこのブラウザの中にだけ保存され、外部には送信されません。</p>
    </div>

    <div id="editor" class="editor hidden">
      <input id="title" class="title" placeholder="タイトル" aria-label="タイトル">
      <div class="meta">
        <input id="date" type="date" aria-label="日付">
        <input id="tags" class="tags" placeholder="タグ(カンマ区切り 例: 読書, AI)" aria-label="タグ" list="taglist">
        <datalist id="taglist"></datalist>
      </div>
      <div class="tabs" role="tablist">
        <button id="tabEdit" class="tab on" role="tab">編集</button>
        <button id="tabView" class="tab" role="tab">プレビュー</button>
        <span class="grow" style="flex:1"></span>
        <span id="wc" class="status" style="align-self:center"></span>
      </div>
      <textarea id="body" class="body" placeholder="本文(Markdown が使えます)" aria-label="本文"></textarea>
      <div id="preview" class="preview hidden"></div>
    </div>
  </main>
</div>
<section id="todoView" class="todoView hidden">
  <div class="todoWrap">
    <div class="addbox">
      <input id="tdText" class="field text" placeholder="やることを入力(Enterで追加)" aria-label="ToDo">
      <div class="row wrap">
        <input id="tdDate" class="field" type="date" aria-label="期限の日付">
        <input id="tdTime" class="field" type="time" aria-label="期限の時刻">
        <select id="tdRepeat" class="field" aria-label="繰り返し">
          <option value="none">繰り返しなし</option><option value="daily">毎日</option>
          <option value="weekly">毎週</option><option value="monthly">毎月</option>
        </select>
        <button id="tdAdd" class="btn primary">追加</button>
      </div>
    </div>
    <div class="row between wrap">
      <div id="tdFilters" class="tagbar"></div>
      <button id="tdNotify" class="btn"></button>
    </div>
    <div id="tdList"></div>
    <p class="status">時刻を決めない場合は期限日の9:00に通知します。通知はこのページを開いている間だけ動きます。スマホなどで確実に通知したいときは 📅 でカレンダーに追加してください。</p>
  </div>
</section>
<input id="file" type="file" accept=".md,.markdown,.txt,.json" multiple class="hidden">

<script>
"use strict";
/* ============ 小さなユーティリティ ============ */
const $ = id => document.getElementById(id);
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function download(name, blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

/* ============ IndexedDB(このブラウザ内だけに保存) ============ */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("local-memo",2);
    r.onupgradeneeded = () => { const d=r.result; if(!d.objectStoreNames.contains("notes")) d.createObjectStore("notes",{keyPath:"id"}); if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta"); if(!d.objectStoreNames.contains("todos")) d.createObjectStore("todos",{keyPath:"id"}); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const tx = (store,mode,fn) => new Promise((res,rej)=>{
  const t = db.transaction(store,mode); const out = fn(t.objectStore(store));
  t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
});
const dbAll = () => tx("notes","readonly",s=>s.getAll());
const dbPut = n => tx("notes","readwrite",s=>s.put(n));
const dbDel = id => tx("notes","readwrite",s=>s.delete(id));
const metaGet = k => tx("meta","readonly",s=>s.get(k));
const metaSet = (k,v) => tx("meta","readwrite",s=>s.put(v,k));

/* ============ 状態 ============ */
let notes = [];
let curId = null;
let filterTag = null;
let dirHandle = null;     // 自動保存先フォルダ
let dirReady = false;
let saveTimer = null;

/* ============ Markdown 変換(保存形式) ============ */
function toMarkdown(n){
  const tags = "[" + n.tags.map(t => /[,\[\]:#"']/.test(t) ? JSON.stringify(t) : t).join(", ") + "]";
  return "---\n" +
    "id: " + n.id + "\n" +
    "title: " + JSON.stringify(n.title) + "\n" +
    "date: " + n.date + "\n" +
    "tags: " + tags + "\n" +
    "---\n\n" + n.body.replace(/\s+$/,"") + "\n";
}
function parseMarkdown(text, fallbackName){
  text = text.replace(/^\uFEFF/,"").replace(/\r\n/g,"\n");
  const n = { id: uid(), title: "", date: today(), tags: [], body: text, pinned:false, updated: Date.now() };
  const m = text.match(/^---\n([\s\S]*?)\n---\n?/);
  if (m){
    n.body = text.slice(m[0].length).replace(/^\n/,"");
    for (const line of m[1].split("\n")){
      const kv = line.match(/^(\w+):\s*(.*)$/); if(!kv) continue;
      const k = kv[1], v = kv[2].trim();
      if (k==="id" && v) n.id = v;
      else if (k==="title"){ try{ n.title = v.startsWith('"') ? JSON.parse(v) : v; }catch{ n.title=v; } }
      else if (k==="date" && /^\d{4}-\d{2}-\d{2}/.test(v)) n.date = v.slice(0,10);
      else if (k==="tags"){
        const inner = v.replace(/^\[|\]$/g,"");
        n.tags = inner.split(",").map(s=>s.trim().replace(/^["']|["']$/g,"")).filter(Boolean);
      }
    }
  }
  if (!n.title){
    const h = n.body.match(/^#\s+(.+)$/m);
    n.title = h ? h[1].trim() : (fallbackName||"無題").replace(/\.(md|markdown|txt)$/i,"").replace(/^\d{4}-\d{2}-\d{2}_?/,"");
  }
  return n;
}
function fileNameFor(n){
  const safe = (n.title||"無題").replace(/[\\/:*?"<>|\n\r\t]/g," ").trim().slice(0,60) || "無題";
  let base = n.date + "_" + safe, name = base + ".md", i = 2;
  while (notes.some(o => o.id!==n.id && o.filename===name)) name = base + "-" + (i++) + ".md";
  return name;
}

/* ============ 簡易 Markdown プレビュー ============ */
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function renderMd(src){
  const lines = src.replace(/\r\n/g,"\n").split("\n");
  let html="", i=0;
  while(i<lines.length){
    const l = lines[i];
    if (/^```/.test(l)){
      const buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html += "<pre><code>"+esc(buf.join("\n"))+"</code></pre>"; continue;
    }
    let m;
    if ((m=l.match(/^(#{1,3})\s+(.*)$/))){ html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(l)){ html+="<hr>"; i++; continue; }
    if (/^>\s?/.test(l)){
      const buf=[]; while(i<lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,""));
      html += "<blockquote>"+inline(buf.join("<br>"))+"</blockquote>"; continue;
    }
    if (/^\s*[-*]\s+/.test(l)){
      let items=""; while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items+="<li>"+inline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>"; i++; }
      html += "<ul>"+items+"</ul>"; continue;
    }
    if (/^\s*\d+\.\s+/.test(l)){
      let items=""; while(i<lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items+="<li>"+inline(lines[i].replace(/^\s*\d+\.\s+/,""))+"</li>"; i++; }
      html += "<ol>"+items+"</ol>"; continue;
    }
    if (!l.trim()){ i++; continue; }
    const buf=[]; while(i<lines.length && lines[i].trim() && !/^(#{1,3}\s|```|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) buf.push(lines[i++]);
    html += "<p>"+inline(buf.join("\n")).replace(/\n/g,"<br>")+"</p>";
  }
  return html || '<p class="status">本文がありません</p>';
}

/* ============ フォルダ自動保存(File System Access API) ============ */
const fsSupported = "showDirectoryPicker" in window;
async function checkDirPerm(request){
  if(!dirHandle) return false;
  let p = await dirHandle.queryPermission({mode:"readwrite"});
  if (p!=="granted" && request) p = await dirHandle.requestPermission({mode:"readwrite"});
  dirReady = p==="granted"; updateFolderNote(); return dirReady;
}
function updateFolderNote(){
  $("folderNote").textContent = !fsSupported ? "フォルダ保存は Chrome / Edge のPC版で使えます"
    : !dirHandle ? "未設定:メモを .md として直接フォルダに保存できます"
    : dirReady ? "保存先: " + dirHandle.name + "(自動保存中)"
    : "保存先: " + dirHandle.name + "(クリックで再許可)";
}
async function writeFile(n){
  if(!dirReady) return;
  try{
    const name = fileNameFor(n);
    if (n.filename && n.filename!==name){ try{ await dirHandle.removeEntry(n.filename); }catch{} }
    n.filename = name;
    const fh = await dirHandle.getFileHandle(name,{create:true});
    const w = await fh.createWritable(); await w.write(toMarkdown(n)); await w.close();
  }catch(e){ console.error(e); setStatus("フォルダへの保存に失敗しました"); }
}
async function chooseFolder(){
  if(!fsSupported){ toast("このブラウザはフォルダ保存に未対応です"); return; }
  if (dirHandle && !dirReady){ if(await checkDirPerm(true)){ await syncAllToFolder(); } return; }
  try{
    dirHandle = await showDirectoryPicker({mode:"readwrite"});
    await metaSet("dir", dirHandle);
    dirReady = true; updateFolderNote();
    // 既存の .md を取り込み
    let imported = 0;
    for await (const [name,h] of dirHandle.entries()){
      if (h.kind!=="file" || !/\.md$/i.test(name) || name==="_todos.md") continue;
      const text = await (await h.getFile()).text();
      const n = parseMarkdown(text,name); n.filename = name;
      const same = notes.find(o => o.id===n.id || o.filename===name);
      if (!same){ notes.push(n); await dbPut(n); imported++; }
    }
    await syncAllToFolder();
    refresh(); toast("フォルダを設定しました" + (imported? "("+imported+"件を取り込み)":""));
  }catch(e){ if(e.name!=="AbortError") console.error(e); }
}

/* ============ ZIP 作成(ライブラリ不要) ============ */
const crcTable = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = crcTable[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc = new TextEncoder(), parts=[], central=[]; let offset=0;
  for(const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true);
    parts.push(lh.buffer,name,data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(ch.buffer,name);
    offset += 30 + name.length + data.length;
  }
  const csize = central.reduce((s,p)=>s+(p.byteLength),0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csize,true); end.setUint32(16,offset,true);
  return new Blob([...parts,...central,end.buffer],{type:"application/zip"});
}

/* ============ ToDo(リマインド付き) ============ */
let todos = [];
let tdFilter = "open";
let editingTd = null;
const tdAll = () => tx("todos","readonly",s=>s.getAll());
const tdPut = t => tx("todos","readwrite",s=>s.put(t));
const tdDel = id => tx("todos","readwrite",s=>s.delete(id));
const pad2 = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const REPEAT = {none:"", daily:"毎日", weekly:"毎週", monthly:"毎月"};
const dueTs = t => new Date(t.due+"T"+(t.time||"09:00")).getTime();
function isOverdue(t){ if(t.done||!t.due) return false; return t.time ? dueTs(t) < Date.now() : t.due < today(); }
function fmtDue(t){
  if(!t.due) return "";
  const d = new Date(t.due+"T00:00"), tmr = new Date(); tmr.setDate(tmr.getDate()+1);
  const s = t.due===today() ? "今日" : t.due===ymd(tmr) ? "明日" : (d.getMonth()+1)+"/"+d.getDate()+"("+"日月火水木金土"[d.getDay()]+")";
  return s + (t.time ? " "+t.time : "");
}
function nextDue(t){
  const d = new Date(t.due+"T00:00");
  const step = () => { if(t.repeat==="daily") d.setDate(d.getDate()+1); else if(t.repeat==="weekly") d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1); };
  step(); while (ymd(d) < today()) step();
  return ymd(d);
}
function tdVisible(t){
  switch(tdFilter){
    case "open": return !t.done;
    case "today": return !t.done && t.due===today();
    case "overdue": return isOverdue(t);
    case "done": return t.done;
    default: return true;
  }
}
function todoHtml(t){
  if (editingTd===t.id){
    const opts = Object.keys(REPEAT).map(k=>`<option value="${k}" ${t.repeat===k?"selected":""}>${REPEAT[k]||"繰り返しなし"}</option>`).join("");
    return `<div class="td" data-id="${t.id}"><div class="tdmain">
      <input class="field tdedit" data-k="text" value="${esc(t.text)}" aria-label="ToDo内容">
      <div class="row wrap" style="margin-top:8px">
        <input type="date" class="field" data-k="due" value="${t.due}"><input type="time" class="field" data-k="time" value="${t.time||""}">
        <select class="field" data-k="repeat">${opts}</select>
        <button class="btn primary" data-a="save">保存</button><button class="btn" data-a="cancel">キャンセル</button>
      </div></div></div>`;
  }
  const over = isOverdue(t), isToday = !t.done && t.due===today();
  return `<div class="td ${t.done?"done":""}" data-id="${t.id}">
    <input type="checkbox" class="chk" ${t.done?"checked":""} aria-label="完了にする">
    <div class="tdmain"><div class="tdtext">${esc(t.text)}</div>
      <div class="tdmeta">
        ${t.due?`<span class="due ${over?"over":isToday?"today":""}">${over?"期限切れ ":"期限 "}${fmtDue(t)}</span>`:""}
        ${t.repeat!=="none"?`<span>🔁 ${REPEAT[t.repeat]}</span>`:""}
      </div></div>
    <button class="ib" data-a="ics" title="カレンダーに追加(.ics)">📅</button>
    <button class="ib" data-a="edit" title="編集">✎</button>
    <button class="ib" data-a="del" title="削除">×</button>
  </div>`;
}
function updateBadge(){
  const n = todos.filter(t=>!t.done && t.due && (t.due<=today())).length;
  $("todoBadge").textContent = n; $("todoBadge").classList.toggle("hidden", !n);
}
function updateNotifyBtn(){
  const b = $("tdNotify");
  if(!("Notification" in window)){ b.textContent = "🔔 通知は未対応"; b.disabled = true; return; }
  b.textContent = Notification.permission==="granted" ? "🔔 通知: オン" : Notification.permission==="denied" ? "🔕 通知: ブロック中" : "🔔 通知を有効にする";
}
function renderTodos(){
  const c = {open:0,today:0,overdue:0,done:0,all:todos.length};
  todos.forEach(t=>{ if(t.done) c.done++; else { c.open++; if(t.due===today()) c.today++; } if(isOverdue(t)) c.overdue++; });
  const labels = [["open","未完了"],["today","今日"],["overdue","期限切れ"],["done","完了"],["all","すべて"]];
  $("tdFilters").innerHTML = labels.map(([k,l])=>`<button class="chip ${k===tdFilter?"on":""}" data-f="${k}">${l} ${c[k]}</button>`).join("");
  const rows = todos.filter(tdVisible).sort((a,b)=> (a.done-b.done) || (a.done ? b.doneAt-a.doneAt : ((a.due?dueTs(a):Infinity)-(b.due?dueTs(b):Infinity)) || a.created-b.created));
  $("tdList").innerHTML = rows.length ? rows.map(todoHtml).join("")
    : `<div class="empty">${todos.length ? "この条件のToDoはありません" : "ToDoはまだありません。<br>上の入力欄から追加しましょう。"}</div>`;
  updateBadge(); updateNotifyBtn();
  if (editingTd){ const e = document.querySelector(".tdedit"); if(e && document.activeElement!==e && !e.dataset.f){ e.dataset.f="1"; e.focus(); } }
}
async function addTodo(){
  const text = $("tdText").value.trim();
  if(!text){ $("tdText").focus(); return; }
  const due = $("tdDate").value;
  const t = { id:uid(), text, due, time: due ? $("tdTime").value : "", repeat: due ? $("tdRepeat").value : "none", done:false, doneAt:0, created:Date.now(), notified:false };
  todos.push(t); await tdPut(t);
  $("tdText").value=""; $("tdDate").value=""; $("tdTime").value=""; $("tdRepeat").value="none";
  renderTodos(); writeTodosFile(); $("tdText").focus(); checkReminders();
}
async function toggleTodo(id){
  const t = todos.find(x=>x.id===id); if(!t) return;
  if (!t.done && t.repeat!=="none" && t.due){ t.due = nextDue(t); t.notified = false; toast("次回: "+fmtDue(t)); }
  else { t.done = !t.done; t.doneAt = t.done ? Date.now() : 0; if(!t.done) t.notified = false; }
  await tdPut(t); renderTodos(); writeTodosFile();
}
async function saveTodoEdit(row){
  const t = todos.find(x=>x.id===row.dataset.id); if(!t) return;
  const g = k => row.querySelector(`[data-k="${k}"]`).value;
  const text = g("text").trim(); if(!text){ toast("内容を入力してください"); return; }
  const due = g("due");
  if (due!==t.due || (due && g("time")!==t.time)) t.notified = false;
  t.text = text; t.due = due; t.time = due ? g("time") : ""; t.repeat = due ? g("repeat") : "none";
  editingTd = null; await tdPut(t); renderTodos(); writeTodosFile();
}
function todoIcs(t){
  if(!t.due){ toast("先に期限を設定してください(✎で編集)"); return; }
  const stamp = new Date().toISOString().replace(/[-:]|\.\d{3}/g,"");
  const e = s => s.replace(/[\\;,]/g,"\\$&").replace(/\n/g,"\\n");
  const d = t.due.replace(/-/g,"");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//local-memo//JA","BEGIN:VEVENT","UID:"+t.id+"@local-memo","DTSTAMP:"+stamp,
    t.time ? "DTSTART:"+d+"T"+t.time.replace(":","")+"00" : "DTSTART;VALUE=DATE:"+d,
    "SUMMARY:"+e(t.text)];
  const r = {daily:"DAILY",weekly:"WEEKLY",monthly:"MONTHLY"}[t.repeat]; if(r) L.push("RRULE:FREQ="+r);
  L.push("BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:"+e(t.text),"END:VALARM","END:VEVENT","END:VCALENDAR");
  download("todo-"+t.due+".ics", new Blob([L.join("\r\n")],{type:"text/calendar"}));
}
function todosMd(){
  const line = t => "- ["+(t.done?"x":" ")+"] "+t.text+(t.due||t.repeat!=="none" ? "(" + [t.due?"期限: "+t.due+(t.time?" "+t.time:""):"", REPEAT[t.repeat]].filter(Boolean).join(" / ") + ")" : "");
  const open = todos.filter(t=>!t.done), done = todos.filter(t=>t.done);
  return "---\ntitle: \"ToDo\"\ndate: "+today()+"\ntags: [todo]\n---\n\n## 未完了\n\n"+(open.map(line).join("\n")||"(なし)")+"\n\n## 完了\n\n"+(done.map(line).join("\n")||"(なし)")+"\n";
}
async function writeTodosFile(){
  if(!dirReady) return;
  try{ const fh = await dirHandle.getFileHandle("_todos.md",{create:true}); const w = await fh.createWritable(); await w.write(todosMd()); await w.close(); }catch(e){ console.error(e); }
}
/* リマインド:ページを開いている間、30秒ごとに期限をチェック */
let remindTimer = null;
function checkReminders(){
  const now = Date.now(), fired = [];
  for (const t of todos){ if(t.done||!t.due||t.notified) continue; if(dueTs(t)<=now){ t.notified=true; tdPut(t); fired.push(t); } }
  if (fired.length){
    const msg = fired.length===1 ? fired[0].text : "期限が来たToDoが"+fired.length+"件あります";
    if ("Notification" in window && Notification.permission==="granted"){ try{ new Notification("ToDo", {body: msg}); }catch{} }
    toast("⏰ "+msg);
  }
  if (!editingTd) renderTodos(); else updateBadge();
}

    db = await openDB();
    notes = await dbAll(); todos = await tdAll();
    const th = await metaGet("theme"); if(th) document.documentElement.dataset.theme = th;
    try{ dirHandle = await metaGet("dir") || null; }catch{ dirHandle=null; }
    if (dirHandle) await checkDirPerm(false);
    updateFolderNote();
  }catch(e){
    console.error(e); toast("このブラウザではデータ保存を利用できません(プライベートモード等)");
  }
  refresh(); open(null); renderTodos(); startReminders();
  if (await metaGet("mode")==="todo") setMode("todo");
})();
</script>
</body>
</html>
